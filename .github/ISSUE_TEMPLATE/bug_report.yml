name: Bug report
description: Something in Pocket Box doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Security problems go through **Security → Report a vulnerability** instead, never here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pocket Box version
      description: Settings → About.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Phone
      options:
        - Pixel 8
        - Pixel 8 Pro
        - Pixel 8a
        - Pixel 9
        - Pixel 9 Pro
        - Pixel 9 Pro XL
        - Pixel 9a
        - Pixel 10
        - Pixel 10 Pro
        - Pixel 10 Pro XL
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: GrapheneOS or Android version
      placeholder: GrapheneOS 2026111000, or Android 16
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio output and file format (if it's about sound)
      placeholder: USB-C DAC, 24-bit/96 kHz FLAC
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots help. Please don't attach music files you don't have the right to share.
