# Builds a signed release APK and publishes it with its SHA-256 checksum as a GitHub Release, either
# when a version tag (v1.0.0, v1.1.0-beta.1, …) is pushed, or when started by hand (Actions → Release →
# Run workflow) with a version number and optional release notes; then it creates the tag itself, or, for a
# version that's already published, moves its tag to the new build and replaces the APK and checksum. Only official actions, each
# pinned to a full commit SHA. Signing comes from encrypted repository secrets (see BUILDING.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 1.0.0-beta.1)"
        required: true
        type: string
      notes:
        description: "Release notes (Markdown); the checksum line is added below them"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the tag and release and upload the APK
    defaults:
      run:
        working-directory: android # the Gradle project lives in android/
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - name: Check the version number
        working-directory: ${{ github.workspace }} # android/ isn't checked out yet
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$TAG' isn't a version like v1.0.0 or v1.1.0-beta.1."
            exit 1
          fi

      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the Gradle wrapper is genuine
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Install the Android SDK parts Pocket Box builds with
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Run the unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Restore the signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.POCKETBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The POCKETBOX_KEYSTORE_BASE64 secret is missing. See BUILDING.md, 'Optional: publish releases from GitHub'."
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          POCKETBOX_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          POCKETBOX_KEYSTORE_PASSWORD: ${{ secrets.POCKETBOX_KEYSTORE_PASSWORD }}
          POCKETBOX_KEY_ALIAS: ${{ secrets.POCKETBOX_KEY_ALIAS }}
          POCKETBOX_KEY_PASSWORD: ${{ secrets.POCKETBOX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Check the signature and write the checksum
        run: |
          apk="PocketBox-${TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"

      - name: Remove the signing key
        if: always()
        working-directory: ${{ github.workspace }} # works even if checkout never happened
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }} # passed as data, never pasted into the script
        run: |
          apk="PocketBox-${TAG#v}.apk"
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # A pushed tag already exists; a hand-started run creates it on the commit it built.
          tag_option="--verify-tag"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then tag_option="--target=$GITHUB_SHA"; fi
          check="Check the download with: sha256sum -c $apk.sha256"
          notes="${NOTES:-Signed APK for Pixel 6 and newer.}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && gh release view "$TAG" > /dev/null 2>&1; then
            # Re-publishing a version: the tag moves to the commit just built, and the APK and checksum are replaced.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload "$TAG" "$apk" "$apk.sha256" --clobber
            if [ -n "$NOTES" ]; then gh release edit "$TAG" --notes "$notes"$'\n\n'"$check"; fi
          else
            gh release create "$TAG" "$apk" "$apk.sha256" "$tag_option" --title "Pocket Box ${TAG#v}" --notes "$notes"$'\n\n'"$check" $prerelease
          fi
